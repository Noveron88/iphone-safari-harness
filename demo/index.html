<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>iPhone Safari próba</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #14243b; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 580px; margin: auto; padding: calc(30px + env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom)); }
    small { color: #2c61c4; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: clamp(32px, 9vw, 46px); line-height: 1.05; letter-spacing: -.04em; }
    p { color: #536278; font-size: 16px; line-height: 1.55; }
    section { margin-top: 26px; padding: 22px; background: white; border-radius: 22px; box-shadow: 0 12px 36px #182b4a17; }
    h2 { margin: 0; font-size: 20px; }
    button { width: 100%; min-height: 48px; margin-top: 16px; border: 0; border-radius: 13px; color: white; background: #2864d8; font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <small>Automatikus Safari ellenőrzés</small>
    <h1>iOS Safari a felhőben</h1>
    <p>Ha ezt iPhone 14 Safari-képernyőképen látod, az ellenőrzési lánc működik.</p>
    <section>
      <h2>Első vizuális próba</h2>
      <p>A kártya és a kék gomb legyen látható vízszintes kilógás nélkül.</p>
      <button type="button" onclick="this.textContent='Működik!'">Próbagomb</button>
    </section>
  </main>
</body>
</html>
